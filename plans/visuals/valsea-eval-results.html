  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;valsea-eval-viz&quot;);
    const dataNode = root.querySelector(&quot;#valsea-data&quot;);
    const data = JSON.parse(dataNode.textContent);
    const demoLabel = &quot;DEMO DATA — NOT A MODEL RUN&quot;;
    const demoFail = new Set([&quot;CASE_012&quot;, &quot;CASE_024&quot;, &quot;CASE_030&quot;]);
    const demoPartial = new Set([&quot;CASE_006&quot;, &quot;CASE_015&quot;, &quot;CASE_021&quot;, &quot;CASE_026&quot;, &quot;CASE_028&quot;]);
    const demoStatus = Object.fromEntries(data.cases.map((item) =&gt; [
      item.id,
      demoFail.has(item.id) ? &quot;fail&quot; : demoPartial.has(item.id) ? &quot;partial&quot; : &quot;pass&quot;
    ]));

    const state = {
      mode: &quot;coverage&quot;,
      suite: &quot;all&quot;,
      failure: &quot;all&quot;,
      selected: data.cases[0].id
    };

    const nodes = {
      theme: root.querySelector(&quot;#valsea-theme-toggle&quot;),
      coverage: root.querySelector(&quot;#valsea-mode-coverage&quot;),
      demo: root.querySelector(&quot;#valsea-mode-demo&quot;),
      truth: root.querySelector(&quot;#valsea-truth-label&quot;),
      pageDemo: root.querySelector(&quot;#valsea-page-demo-label&quot;),
      summary: root.querySelector(&quot;#valsea-summary&quot;),
      chartHeading: root.querySelector(&quot;#valsea-chart-heading&quot;),
      chartContext: root.querySelector(&quot;#valsea-chart-context&quot;),
      chart: root.querySelector(&quot;#valsea-chart&quot;),
      suite: root.querySelector(&quot;#valsea-suite-filter&quot;),
      failure: root.querySelector(&quot;#valsea-failure-filter&quot;),
      gridCount: root.querySelector(&quot;#valsea-grid-count&quot;),
      gridDemo: root.querySelector(&quot;#valsea-grid-demo-label&quot;),
      grid: root.querySelector(&quot;#valsea-case-grid&quot;),
      legend: root.querySelector(&quot;#valsea-legend&quot;),
      position: root.querySelector(&quot;#valsea-selection-position&quot;),
      caseSummary: root.querySelector(&quot;#valsea-case-summary&quot;),
      timeline: root.querySelector(&quot;#valsea-timeline&quot;)
    };

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function label(value) {
      return String(value || &quot;—&quot;)
        .replaceAll(&quot;_&quot;, &quot; &quot;)
        .replace(/\b\w/g, (letter) =&gt; letter.toUpperCase());
    }

    function statCard(title, value, context) {
      const card = element(&quot;div&quot;, &quot;card viz-stat&quot;);
      card.append(
        element(&quot;div&quot;, &quot;text-small&quot;, title),
        element(&quot;div&quot;, &quot;viz-stat-value&quot;, String(value)),
        element(&quot;div&quot;, &quot;text-small&quot;, context)
      );
      return card;
    }

    function badge(text, extraClass = &quot;&quot;) {
      return element(&quot;span&quot;, `viz-badge ${extraClass}`.trim(), text);
    }

    function filteredCases() {
      return data.cases.filter((item) =&gt;
        (state.suite === &quot;all&quot; || item.suite === state.suite) &amp;&amp;
        (state.failure === &quot;all&quot; || item.failureType === state.failure)
      );
    }

    function ensureSelection(items) {
      if (!items.some((item) =&gt; item.id === state.selected)) {
        state.selected = items[0]?.id || null;
      }
    }

    function renderSummary(items) {
      nodes.summary.replaceChildren();
      if (state.mode === &quot;coverage&quot;) {
        const exchanges = items.reduce((sum, item) =&gt; sum + item.turns.length, 0);
        const families = new Set(items.map((item) =&gt; item.failureType)).size;
        nodes.summary.append(
          statCard(&quot;Cases shown&quot;, items.length, `${data.cases.length} canonical cases total`),
          statCard(&quot;Expected exchanges&quot;, exchanges, `${data.exchangeCount} exchanges in full corpus`),
          statCard(&quot;Failure families&quot;, families, &quot;Failure-driven coverage&quot;)
        );
      } else {
        const counts = { pass: 0, partial: 0, fail: 0 };
        items.forEach((item) =&gt; { counts[demoStatus[item.id]] += 1; });
        nodes.summary.append(
          statCard(&quot;Demo pass&quot;, counts.pass, demoLabel),
          statCard(&quot;Demo partial&quot;, counts.partial, demoLabel),
          statCard(&quot;Demo fail&quot;, counts.fail, demoLabel)
        );
      }
    }

    function renderCoverageChart(items) {
      const counts = new Map();
      items.forEach((item) =&gt; counts.set(item.failureType, (counts.get(item.failureType) || 0) + 1));
      const rows = [...counts.entries()].sort((a, b) =&gt; b[1] - a[1] || a[0].localeCompare(b[0]));
      const max = Math.max(1, ...rows.map((entry) =&gt; entry[1]));
      const list = element(&quot;div&quot;, &quot;valsea-bar-list&quot;);
      list.setAttribute(&quot;role&quot;, &quot;img&quot;);
      list.setAttribute(&quot;aria-label&quot;, `Failure-family coverage across ${items.length} selected cases`);
      rows.forEach(([family, count]) =&gt; {
        const row = element(&quot;div&quot;, &quot;valsea-bar-row&quot;);
        const name = element(&quot;span&quot;, &quot;text-small&quot;, label(family));
        const track = element(&quot;div&quot;, &quot;valsea-bar-track&quot;);
        const fill = element(&quot;div&quot;, &quot;valsea-bar-fill&quot;);
        fill.style.width = `${(count / max) * 100}%`;
        track.append(fill);
        row.append(name, track, element(&quot;span&quot;, &quot;text-small text-end&quot;, String(count)));
        list.append(row);
      });
      nodes.chart.replaceChildren(list);
    }

    function renderDemoChart(items) {
      const counts = { pass: 0, partial: 0, fail: 0 };
      items.forEach((item) =&gt; { counts[demoStatus[item.id]] += 1; });
      const total = Math.max(1, items.length);
      const wrapper = element(&quot;div&quot;, &quot;valsea-chart-section&quot;);
      const stack = element(&quot;div&quot;, &quot;valsea-demo-stack&quot;);
      stack.setAttribute(&quot;role&quot;, &quot;img&quot;);
      stack.setAttribute(&quot;aria-label&quot;, `Synthetic demo distribution: ${counts.pass} pass, ${counts.partial} partial, ${counts.fail} fail. ${demoLabel}`);
      [&quot;pass&quot;, &quot;partial&quot;, &quot;fail&quot;].forEach((status) =&gt; {
        const segment = element(&quot;span&quot;, `valsea-status-${status}`);
        segment.style.width = `${(counts[status] / total) * 100}%`;
        stack.append(segment);
      });
      const key = element(&quot;div&quot;, &quot;valsea-status-key text-small&quot;);
      [&quot;pass&quot;, &quot;partial&quot;, &quot;fail&quot;].forEach((status) =&gt; {
        const item = element(&quot;span&quot;, &quot;valsea-status-key&quot;);
        item.append(
          element(&quot;span&quot;, `valsea-swatch valsea-swatch-${status}`),
          element(&quot;span&quot;, &quot;&quot;, `${label(status)} ${counts[status]}`)
        );
        key.append(item);
      });
      wrapper.append(stack, key);
      nodes.chart.replaceChildren(wrapper);
    }

    function renderChart(items) {
      if (state.mode === &quot;coverage&quot;) {
        nodes.chartHeading.textContent = &quot;Failure-family coverage&quot;;
        nodes.chartContext.textContent = `${items.length} canonical cases shown`;
        renderCoverageChart(items);
      } else {
        nodes.chartHeading.textContent = &quot;Synthetic status distribution&quot;;
        nodes.chartContext.textContent = demoLabel;
        renderDemoChart(items);
      }
    }

    function legendItem(className, text) {
      const item = element(&quot;span&quot;, &quot;valsea-status-key&quot;);
      item.append(element(&quot;span&quot;, `valsea-swatch ${className}`), element(&quot;span&quot;, &quot;&quot;, text));
      return item;
    }

    function renderGrid(items) {
      nodes.grid.replaceChildren();
      nodes.gridCount.textContent = `${items.length} of ${data.cases.length} cases`;
      items.forEach((item) =&gt; {
        const button = element(&quot;button&quot;, &quot;btn viz-tile valsea-case-id&quot;, item.id);
        button.type = &quot;button&quot;;
        button.setAttribute(&quot;role&quot;, &quot;listitem&quot;);
        button.setAttribute(&quot;aria-pressed&quot;, String(item.id === state.selected));
        button.dataset.caseId = item.id;
        if (state.mode === &quot;coverage&quot;) {
          button.classList.add(`valsea-suite-${item.suite}`);
          button.setAttribute(&quot;aria-label&quot;, `${item.id}, ${item.suite}, ${label(item.failureType)}`);
          button.dataset.tooltip = `${label(item.failureType)} · ${item.turns.length} exchanges`;
        } else {
          const status = demoStatus[item.id];
          button.classList.add(`valsea-status-${status}`);
          button.dataset.demoLabel = demoLabel;
          button.setAttribute(&quot;aria-label&quot;, `${item.id}, demo ${status}. ${demoLabel}`);
          button.dataset.tooltip = `Demo ${label(status)} · ${demoLabel}`;
        }
        button.addEventListener(&quot;click&quot;, () =&gt; {
          state.selected = item.id;
          render();
        });
        nodes.grid.append(button);
      });

      nodes.legend.replaceChildren();
      if (state.mode === &quot;coverage&quot;) {
        nodes.legend.append(
          legendItem(&quot;valsea-swatch-base&quot;, &quot;Base suite&quot;),
          legendItem(&quot;valsea-swatch-challenge&quot;, &quot;Challenge suite&quot;)
        );
      } else {
        nodes.legend.append(
          legendItem(&quot;valsea-swatch-pass&quot;, &quot;Demo pass&quot;),
          legendItem(&quot;valsea-swatch-partial&quot;, &quot;Demo partial&quot;),
          legendItem(&quot;valsea-swatch-fail&quot;, &quot;Demo fail&quot;)
        );
      }
    }

    function assertionList(values) {
      if (!values || values.length === 0) return element(&quot;span&quot;, &quot;valsea-empty&quot;, &quot;None&quot;);
      const list = element(&quot;ul&quot;, &quot;valsea-constraint-list&quot;);
      values.forEach((value) =&gt; list.append(element(&quot;li&quot;, &quot;&quot;, value)));
      return list;
    }

    function assertionGroup(title, content) {
      const group = element(&quot;div&quot;, &quot;valsea-assertion-group&quot;);
      group.append(element(&quot;strong&quot;, &quot;&quot;, title), content);
      return group;
    }

    function renderTimeline(item) {
      nodes.timeline.replaceChildren();
      item.turns.forEach((turn) =&gt; {
        const row = element(&quot;article&quot;, &quot;valsea-turn&quot;);
        if (turn.turn === item.focusTurn) row.classList.add(&quot;valsea-focus-turn&quot;);
        const head = element(&quot;div&quot;, &quot;valsea-turn-head&quot;);
        head.append(element(&quot;span&quot;, &quot;valsea-turn-number&quot;, `Turn ${String(turn.turn).padStart(2, &quot;0&quot;)}`));
        if (turn.turn === item.focusTurn) head.append(badge(&quot;Focus turn&quot;));

        const dialogue = element(&quot;div&quot;, &quot;valsea-dialogue&quot;);
        dialogue.append(
          element(&quot;span&quot;, &quot;valsea-speaker text-small&quot;, &quot;Customer&quot;),
          element(&quot;p&quot;, &quot;&quot;, turn.customer),
          element(&quot;span&quot;, &quot;valsea-speaker text-small&quot;, &quot;Expected agent&quot;),
          element(&quot;p&quot;, &quot;&quot;, turn.agent)
        );

        const details = element(&quot;details&quot;);
        details.append(element(&quot;summary&quot;, &quot;text-small&quot;, &quot;Assertions, state and tools&quot;));
        const assertions = element(&quot;div&quot;, &quot;valsea-assertions&quot;);
        assertions.append(
          assertionGroup(&quot;Must include&quot;, assertionList(turn.mustInclude)),
          assertionGroup(&quot;Must not claim&quot;, assertionList(turn.mustNotClaim)),
          assertionGroup(&quot;Forbidden tools&quot;, assertionList(turn.forbiddenTools)),
          assertionGroup(&quot;State set&quot;, turn.stateSet.length ? element(&quot;code&quot;, &quot;&quot;, turn.stateSet.join(&quot; · &quot;)) : element(&quot;span&quot;, &quot;valsea-empty&quot;, &quot;None&quot;)),
          assertionGroup(&quot;State clear&quot;, assertionList(turn.stateClear))
        );
        if (turn.tools.length) {
          const toolList = element(&quot;ul&quot;, &quot;valsea-constraint-list&quot;);
          turn.tools.forEach((tool) =&gt; toolList.append(element(&quot;li&quot;, &quot;&quot;, `${tool.name} ${tool.arguments}`)));
          assertions.append(assertionGroup(&quot;Required tool calls&quot;, toolList));
        } else {
          assertions.append(assertionGroup(&quot;Required tool calls&quot;, element(&quot;span&quot;, &quot;valsea-empty&quot;, &quot;No tool expected&quot;)));
        }
        details.append(assertions);
        row.append(head, dialogue, details);
        nodes.timeline.append(row);
      });
    }

    function renderCaseSummary(item, items) {
      nodes.caseSummary.replaceChildren();
      const head = element(&quot;div&quot;, &quot;valsea-summary-head&quot;);
      const title = element(&quot;div&quot;, &quot;valsea-summary-title&quot;);
      title.append(element(&quot;div&quot;, &quot;valsea-case-id text-small&quot;, item.id), element(&quot;h3&quot;, &quot;&quot;, item.title));
      head.append(title);
      if (state.mode === &quot;demo&quot;) {
        head.append(badge(`${label(demoStatus[item.id])} · ${demoLabel}`, &quot;valsea-demo-label&quot;));
      }
      const meta = element(&quot;div&quot;, &quot;valsea-detail-meta&quot;);
      meta.append(
        badge(label(item.suite)),
        badge(label(item.failureType)),
        badge(`${item.turns.length} exchanges`),
        badge(`Focus turn ${item.focusTurn}`),
        badge(label(item.finalOutcome))
      );
      const purpose = element(&quot;p&quot;, &quot;valsea-purpose&quot;, item.whatItTests);
      const sequence = element(&quot;div&quot;, &quot;valsea-tool-sequence text-small&quot;);
      sequence.append(element(&quot;strong&quot;, &quot;&quot;, &quot;Required tool sequence: &quot;));
      sequence.append(element(&quot;code&quot;, &quot;&quot;, item.requiredTools.length ? item.requiredTools.join(&quot; → &quot;) : &quot;No tool required&quot;));
      nodes.caseSummary.append(head, meta, purpose, sequence);
      nodes.position.textContent = `${items.findIndex((entry) =&gt; entry.id === item.id) + 1} / ${items.length}`;
      renderTimeline(item);
    }

    function renderTruth() {
      const demo = state.mode === &quot;demo&quot;;
      root.dataset.mode = state.mode;
      nodes.truth.textContent = demo ? &quot;Synthetic presentation statuses only&quot; : &quot;Canonical expected behavior · no model result&quot;;
      nodes.pageDemo.hidden = !demo;
      nodes.gridDemo.hidden = !demo;
      nodes.coverage.setAttribute(&quot;aria-pressed&quot;, String(!demo));
      nodes.demo.setAttribute(&quot;aria-pressed&quot;, String(demo));
      nodes.coverage.classList.toggle(&quot;btn-primary&quot;, !demo);
      nodes.demo.classList.toggle(&quot;btn-primary&quot;, demo);
    }

    function render() {
      const items = filteredCases();
      ensureSelection(items);
      renderTruth();
      renderSummary(items);
      renderChart(items);
      renderGrid(items);
      const selected = items.find((item) =&gt; item.id === state.selected);
      if (selected) {
        renderCaseSummary(selected, items);
      } else {
        nodes.caseSummary.replaceChildren(element(&quot;span&quot;, &quot;valsea-empty&quot;, &quot;No cases match the filters.&quot;));
        nodes.timeline.replaceChildren();
        nodes.position.textContent = &quot;0 / 0&quot;;
      }
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
    }

    const failureTypes = [...new Set(data.cases.map((item) =&gt; item.failureType))].sort();
    failureTypes.forEach((failureType) =&gt; {
      const option = element(&quot;option&quot;, &quot;&quot;, label(failureType));
      option.value = failureType;
      nodes.failure.append(option);
    });

    nodes.coverage.addEventListener(&quot;click&quot;, () =&gt; { state.mode = &quot;coverage&quot;; render(); });
    nodes.demo.addEventListener(&quot;click&quot;, () =&gt; { state.mode = &quot;demo&quot;; render(); });
    nodes.suite.addEventListener(&quot;change&quot;, (event) =&gt; { state.suite = event.target.value; render(); });
    nodes.failure.addEventListener(&quot;change&quot;, (event) =&gt; { state.failure = event.target.value; render(); });
    nodes.theme.addEventListener(&quot;click&quot;, () =&gt; {
      const next = document.documentElement.dataset.theme === &quot;dark&quot; ? &quot;light&quot; : &quot;dark&quot;;
      document.documentElement.dataset.theme = next;
      nodes.theme.textContent = next === &quot;dark&quot; ? &quot;Light theme&quot; : &quot;Dark theme&quot;;
      nodes.theme.setAttribute(&quot;aria-pressed&quot;, String(next === &quot;dark&quot;));
    });

    const initialTheme = document.documentElement.dataset.theme || (window.matchMedia(&quot;(prefers-color-scheme: dark)&quot;).matches ? &quot;dark&quot; : &quot;light&quot;);
    document.documentElement.dataset.theme = initialTheme;
    nodes.theme.textContent = initialTheme === &quot;dark&quot; ? &quot;Light theme&quot; : &quot;Dark theme&quot;;
    nodes.theme.setAttribute(&quot;aria-pressed&quot;, String(initialTheme === &quot;dark&quot;));
    render();
  })();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
