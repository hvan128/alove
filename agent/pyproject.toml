[project]
name = "alove-bus-agent"
version = "0.1.1"
description = "Alove LiveKit voice agent for server-authoritative bus booking APIs"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-speechmatics>=1.5.14",
    "livekit-plugins-openai>=1.5.14",
    "livekit-plugins-cartesia>=1.5.14",
    "livekit-plugins-google>=1.5.14",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
    # VALSEA STT plugin talks to the realtime WS directly (aiohttp is also a
    # livekit-agents transitive dep; pinned here so VALSEA mode can't break if it drops).
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
