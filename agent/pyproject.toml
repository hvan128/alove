[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vedi-booking-agent"
version = "0.1.0"
description = "LiveKit voice worker for the VeDi bus-booking demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "livekit-agents[silero]==1.6.5",
  "livekit-plugins-noise-cancellation==0.3.0",
  "livekit-plugins-openai==1.6.5",
  "openai==2.46.0",
  "python-dotenv==1.2.2",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.22",
]

[tool.setuptools]
py-modules = ["agent", "booking_policy", "transcript_translation", "valsea_stt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
